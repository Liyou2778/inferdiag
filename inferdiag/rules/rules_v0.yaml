# inferdiag 诊断规则 v0
# 说明：阈值为 v0 初始值，必须先跑一轮"正常负载基线"再校准（阈值≈基线×1.5~2）。
# 条件中任一 metric 在数据里缺失时，该规则自动跳过（不会误报）。
version: 1

rules:
  - id: R1
    name: OOM 高风险：KV cache 即将打满
    level: critical
    conditions:
      - {metric: kv_cache_usage_pct, op: ge, value: 95}
    suggestion: 调小 max-model-len / 开启前缀缓存 / 降低并发 / 换 FP8·INT4 量化。

  - id: R2
    name: 请求队列积压
    level: warning
    conditions:
      - {metric: num_waiting, op: ge, value: 30}
    suggestion: 队列持续积压会拉高 TTFT：调大 max_num_seqs、扩容副本，或考虑 PD 分离。

  - id: R3
    name: 首 token 延迟(TTFT)偏高
    level: warning
    conditions:
      - {metric: ttft_p50_ms, op: ge, value: 1000}
    suggestion: TTFT>1s 体感明显：检查是否混入超长请求（队头阻塞）、是否开启前缀缓存、是否该上 PD 分离。

  - id: R4
    name: 单 token 生成耗时(TPOT)偏慢
    level: warning
    conditions:
      - {metric: tpot_ms, op: ge, value: 80}
    suggestion: TPOT 慢通常是算力受限：查 GPU 利用率，考虑更强卡/量化/蒸馏。

  - id: R5
    name: KV cache 高位但无抢占
    level: warning
    conditions:
      - {metric: kv_cache_usage_pct, op: ge, value: 80}
      - {metric: preemptions_rate, op: le, value: 0.5}
    suggestion: 显存长期高位将限制并发：建议扩容或提前做容量规划。

  - id: R6
    name: 前缀缓存命中率过低
    level: info
    conditions:
      - {metric: prefix_cache_hit_pct, op: le, value: 20}
    suggestion: 大量重复前缀在反复重算：开启自动前缀缓存，并把常量(系统提示词)放 prompt 前面。

  - id: R7
    name: 吞吐偏低（算力可能浪费）
    level: warning
    conditions:
      - {metric: generation_tokens_rate, op: le, value: 30000}
      - {metric: num_running, op: ge, value: 4}
    suggestion: batch 没吃饱：调大 max_num_seqs / max_num_batched_tokens。

  - id: R8
    name: 每 token 成本异常（需配置单价表后生效）
    level: warning
    conditions:
      - {metric: cost_per_mtok, op: ge, value: 999999}
    suggestion: 请先配置单价表(cost 模块)后再启用本规则。

  - id: R9
    name: 抢占频繁（调度冲突）
    level: warning
    conditions:
      - {metric: preemptions_rate, op: ge, value: 1.0}
    suggestion: 抢占浪费算力：降低并发、给 KV 更多配额、限制超长请求。

  - id: R10
    name: 低峰空转（可能烧钱）
    level: info
    conditions:
      - {metric: kv_cache_usage_pct, op: le, value: 15}
      - {metric: num_running, op: le, value: 1}
    suggestion: 夜间/低峰几乎闲置：考虑缩容、按需实例或换更小模型。

  - id: R11
    name: 长尾延迟恶化(p99)
    level: warning
    conditions:
      - {metric: e2e_p99_ms, op: ge, value: 5000}
    suggestion: p99 超 5s：给长请求限流/超时、设置队列优先级、长请求独立池。

  - id: R12
    name: 可评估 PD 分离(预填充-解码解耦)
    level: info
    conditions:
      - {metric: ttft_p50_ms, op: ge, value: 1000}
      - {metric: num_waiting, op: ge, value: 10}
    suggestion: 长 prompt + 排队明显时，PD 分离收益较大：先跑基线再评估。

  - id: R13
    name: 可评估量化/换更小模型
    level: info
    conditions:
      - {metric: kv_cache_usage_pct, op: ge, value: 90}
    suggestion: 显存吃紧时可对比 FP8/INT4(AWQ) 量化或更小模型的精度-成本权衡。

  - id: R14
    name: 单实例过载，建议扩容
    level: warning
    conditions:
      - {metric: num_waiting, op: ge, value: 20}
      - {metric: requests_success_rate, op: ge, value: 20}
    suggestion: 排队+高到达率说明单实例饱和：扩容或多副本+网关路由。
