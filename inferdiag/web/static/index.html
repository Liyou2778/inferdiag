<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inferdiag · LLM 推理体检</title>
<style>
  /* ============ EF 工业指挥台皮肤（源自 DSH 终末地美化包视觉语言） ============ */
  :root{
    --ef-yellow:#fff44f; --ef-yellow-dim:#d9cd00;
    --ef-black:#090b0d; --ef-panel:#171b1f;
    --ef-card:#111417; --ef-card-2:#181c20;
    --ef-line:rgba(255,244,79,.28); --ef-line-dim:rgba(255,244,79,.14);
    --ef-text:#f5f6f2; --ef-dim:#737b80; --ef-dim2:#5d656a;
    --ef-red:#ff7979; --ef-amber:#ffb020;
    --ef-shadow:0 1px 0 rgba(255,255,255,.05) inset, 5px 6px 0 rgba(0,0,0,.5), 7px 8px 0 rgba(255,244,79,.10), 0 18px 36px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--ef-black); color:var(--ef-text);
    font-family:"EF Harmony","HarmonyOS Sans","PingFang SC","Microsoft YaHei",sans-serif;
    letter-spacing:.01em; padding:22px; min-height:100vh; position:relative;
  }
  /* 背景工业网格 + 斜切光带（同终末地皮肤的底纹语言） */
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      linear-gradient(110deg, transparent 0 71%, rgba(255,244,79,.04) 71% 71.3%, transparent 71.3%),
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size:auto, 56px 56px, 56px 56px; opacity:.5;
  }
  h1{font-size:18px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;display:inline-block}
  h1::before{content:"▮";color:var(--ef-yellow);margin-right:10px;text-shadow:0 0 12px rgba(255,244,79,.5)}
  .sub{color:var(--ef-dim);font-size:11px;margin-top:6px;letter-spacing:.05em}
  .row{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;position:relative;z-index:1}
  .card{
    background:linear-gradient(180deg,var(--ef-card-2),var(--ef-card));
    border:1px solid var(--ef-line-dim); border-radius:1px; padding:16px;
    box-shadow:var(--ef-shadow); transition:border-color .16s ease, transform .16s ease; position:relative;
  }
  .card:hover{border-color:var(--ef-line)}
  .card::before{
    content:""; position:absolute; top:-1px; left:-1px; width:34px; height:2px; background:var(--ef-yellow);
    box-shadow:0 0 8px rgba(255,244,79,.6);
  }
  .label{color:var(--ef-yellow-dim); font-size:11px; letter-spacing:.22em; text-transform:uppercase; margin-bottom:10px}
  #score{font-size:52px;font-weight:900;font-family:"Space Grotesk","Segoe UI",sans-serif;line-height:1;letter-spacing:.02em}
  .badge{display:inline-block;padding:2px 10px;border-radius:1px;font-size:11px;font-weight:600;letter-spacing:.1em;margin-right:8px}
  .critical{background:rgba(255,121,121,.14);color:var(--ef-red);border:1px solid rgba(255,121,121,.4)}
  .warning{background:rgba(255,244,79,.1);color:var(--ef-yellow);border:1px solid rgba(255,244,79,.35)}
  .info{background:rgba(255,255,255,.05);color:#b7c0c8;border:1px solid rgba(255,255,255,.15)}
  .finding{border-bottom:1px solid rgba(255,255,255,.05);padding:10px 0}
  .finding .name{font-weight:600;font-size:13px}
  .finding .sug{color:var(--ef-dim);font-size:12px;margin-top:4px;letter-spacing:.02em}
  .finding .ev{color:var(--ef-yellow);font-size:11px;margin-top:5px;font-family:"Space Grotesk",Consolas,monospace}
  .ok{color:var(--ef-yellow)}
  .metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px;position:relative;z-index:1}
  .m{background:#0e1114;border:1px solid rgba(255,255,255,.07);border-radius:1px;padding:10px;border-left:2px solid var(--ef-yellow-dim)}
  .m .v{font-size:19px;font-weight:700;font-family:"Space Grotesk","Segoe UI",sans-serif}
  .m .k{color:var(--ef-dim);font-size:10px;margin-top:3px;letter-spacing:.12em;text-transform:uppercase}
  canvas{width:100%;height:150px;display:block;margin-top:10px;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(255,255,255,.015) 5px 6px)}
  .dim{color:var(--ef-dim);font-size:11px}
  .err{color:var(--ef-red);margin-top:14px;font-size:13px}
  .two{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px;position:relative;z-index:1}
  #legend{color:var(--ef-dim);font-size:11px;margin-top:8px;letter-spacing:.04em}
  #legend span{margin-right:14px}
  #meta b{color:var(--ef-yellow)}
  .btn{
    background:transparent; color:var(--ef-yellow); border:1px solid var(--ef-yellow-dim);
    border-radius:1px; padding:6px 14px; font-size:12px; letter-spacing:.12em; cursor:pointer;
    font-family:inherit; transition:all .15s ease;
  }
  .btn:hover{background:rgba(255,244,79,.12); box-shadow:0 0 10px rgba(255,244,79,.25)}
  .btn.danger{color:var(--ef-red); border-color:rgba(255,121,121,.5)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .demoBar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
  .demoBar .t{color:var(--ef-dim);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
  #demoStatus{color:var(--ef-yellow);font-size:12px;margin-left:auto;letter-spacing:.05em}
  /* 一键检测 */
  .scanCard{margin-top:14px}
  .scanRow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
  .scanState{color:var(--ef-yellow);font-size:13px}
  .scanState.idle{color:var(--ef-dim)}
  .track{flex:1;min-width:160px;height:6px;background:#0e1114;border:1px solid rgba(255,244,79,.2)}
  #scanBar{height:100%;width:0%;background:var(--ef-yellow);box-shadow:0 0 8px rgba(255,244,79,.5);transition:width .4s}
  .scanLog{font-family:Consolas,"Space Grotesk",monospace;font-size:11px;color:var(--ef-dim);
    background:#0a0d10;border:1px solid rgba(255,255,255,.06);padding:8px;height:110px;
    overflow-y:auto;margin-top:10px;white-space:pre-wrap;word-break:break-all}
  @media(max-width:900px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
  <h1>Inferdiag · 推理体检终端</h1>
  <div class="sub" id="meta">连接中…</div>

  <div class="demoBar">
    <span class="t">Demo Load · 一键压测演示</span>
    <button class="btn" id="dLight" onclick="demoStart(2,8,300)">轻</button>
    <button class="btn" id="dMed" onclick="demoStart(4,16,500)">中</button>
    <button class="btn" id="dHeavy" onclick="demoStart(6,28,800)">重</button>
    <button class="btn danger" id="dStop" onclick="demoStop()">停止</button>
    <span id="demoStatus">空闲</span>
  </div>

  <div class="card scanCard">
    <div class="label">One-Click Scan · 一键检测</div>
    <div class="scanRow">
      <button class="btn on" id="btnScan" onclick="scanStart()">▶ 开始一键检测（默认 30 秒）</button>
      <button class="btn danger" id="btnScanStop" style="display:none" onclick="scanStop()">停止</button>
      <span class="scanState idle" id="scanState">未开始：点击后自动采集并实时显示进度</span>
      <div class="track"><div id="scanBar"></div></div>
    </div>
    <pre class="scanLog" id="scanLog">（实时进度将显示在这里）</pre>
  </div>

  <div class="card" id="scanResult" style="display:none;margin-top:14px">
    <div class="label">Scan Report · 本次一键检测报告</div>
    <div id="scanResultBody">–</div>
  </div>

  <div class="row">
    <div class="card" style="max-width:230px">
      <div class="label">System Health · 健康度</div>
      <div id="score" style="color:var(--ef-yellow)">–</div>
      <div class="sub" id="scoreNote"></div>
    </div>
    <div class="card" style="flex:3">
      <div class="label">Diagnosis · 诊断建议</div>
      <div id="findings">–</div>
    </div>
  </div>

  <div class="two">
    <div class="card">
      <div class="label">Live Telemetry · 关键指标 <span class="dim">(最近 <span id="nPts">–</span> 点)</span></div>
      <canvas id="chart"></canvas>
      <div id="legend"></div>
    </div>
    <div class="card">
      <div class="label">Snapshot · 当前快照</div>
      <div class="metrics" id="metrics">–</div>
    </div>
  </div>
  <div class="err" id="err"></div>
  <script src="/static/app.js?v=20260904b"></script>
</body>
</html>
